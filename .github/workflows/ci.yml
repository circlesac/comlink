name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go vet ./...
      - run: go test -race ./...
      - name: build and run the binary
        run: |
          go build -o comlink .
          ./comlink --help
          ./comlink --version
